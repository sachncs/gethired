name: release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Set up Python
        run: uv python install "3.12"
      - name: Build wheel
        run: uv build --wheel
      - name: Publish to PyPI
        run: uv publish --token ${{ secrets.PYPI_TOKEN }}
