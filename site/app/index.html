<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/gethired/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#06060A" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="gethired — production-grade multi-agent CV tailoring system grounded in a master resume and verified against 12 ATS gates." />
    <meta property="og:title" content="gethired — Tailored resumes. Grounded in truth." />
    <meta property="og:description" content="A layered, multi-agent pipeline that rewrites your master resume against any job description — without fabrication, with ATS-grade output." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sachncs.github.io/gethired/" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>gethired — Tailored resumes. Grounded in truth.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Persisted theme preference with a no-flash default.
      (function () {
        try {
          var stored = localStorage.getItem("gh-theme");
          if (stored === "light") document.documentElement.classList.remove("dark");
          else document.documentElement.classList.add("dark");
        } catch (_) {}
      })();
    </script>
  </head>
  <body class="bg-ink-50 text-ink-900 dark:bg-ink-950 dark:text-ink-50 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
