task:
  id: parser_cap_special_chars_in_company
  desc: Parser handles TeX-escaped quotes in company names ({\"e} for umlaut)
  category: parser
  type: parser
  tags: [capability]
  input:
    tex_path: tests/fixtures/capability_special_chars.tex
  graders:
    - name: code.text_contains
      args:
        name: company_extracted
        text: Test Co
        substring: Test Co
    - name: code.field_length
      args:
        name: experiences_present
        resume: $output
        path: master.experiences
        expected: 1
