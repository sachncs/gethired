task:
  id: parser_basic_001
  desc: Parser extracts contact fields from the canonical resume.tex
  category: parser
  type: parser
  tags: [capability, regression]
  input:
    tex_path: sample.tex
  graders:
    - name: code.field_present
      args:
        name: contact.name_present
        resume: $master
        path: contact.name
    - name: code.field_present
      args:
        name: contact.email_present
        resume: $master
        path: contact.email
    - name: code.equal
      args:
        name: name_value
        actual: Placeholder Name
        expected: Placeholder Name
